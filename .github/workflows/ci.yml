name: CI

# Four-stage pipeline matching the assignment brief: lint -> unit test ->
# train -> containerize+smoke-test. Each stage only runs if the previous
# one succeeded, and every stage uploads its own artifacts so a failure
# can be diagnosed from the Actions UI without re-running anything locally.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: flake8 src tests

  test:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml --junitxml=pytest-report.xml

      # fails the job (and the pipeline) loudly if any test errors out —
      # pytest's own non-zero exit code already does this, this step is
      # just here so the report is visible/downloadable even on success
      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            pytest-report.xml
            coverage.xml

  train:
    name: Train & track with MLflow
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset
        run: python -m src.data.download_data

      - name: Train models (Logistic Regression + Random Forest) with MLflow tracking
        run: python -m src.models.train

      - name: Show champion model metrics (fails the build if metrics file is missing)
        run: python -c "import json; print(json.dumps(json.load(open('models/model_metadata.json')), indent=2))"

      - name: Upload trained model + MLflow run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/model.pkl
            models/model_metadata.json
            mlruns/

  docker:
    name: Build & smoke-test Docker image
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models

      - name: Build Docker image
        run: docker build -t heart-disease-api:ci -f docker/Dockerfile .

      - name: Run container
        run: docker run -d --name heart-disease-api -p 8000:8000 heart-disease-api:ci

      - name: Wait for API to become healthy
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "API never became healthy" >&2
          docker logs heart-disease-api
          exit 1

      - name: Smoke-test /predict with sample input
        run: |
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":63,"sex":1,"cp":1,"trestbps":145,"chol":233,"fbs":1,"restecg":2,"thalach":150,"exang":0,"oldpeak":2.3,"slope":3,"ca":0,"thal":6}' \
            | tee predict-response.json
          python -c "import json; d=json.load(open('predict-response.json')); assert d['prediction'] in (0,1); assert 'confidence' in d"

      - name: Dump container logs
        if: always()
        run: docker logs heart-disease-api > container.log 2>&1 || true

      - name: Upload Docker smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-test
          path: |
            predict-response.json
            container.log

      - name: Stop container
        if: always()
        run: docker rm -f heart-disease-api || true
