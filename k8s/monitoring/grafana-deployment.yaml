apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: heart-disease
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - containerPort: 3000
          env:
            # demo-only credentials — change before exposing this beyond
            # a local Minikube cluster
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: datasource-volume
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider-volume
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-volume
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasource-volume
          configMap:
            name: grafana-datasource
        - name: dashboard-provider-volume
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-volume
          configMap:
            name: grafana-dashboard-heart-disease-api
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: heart-disease
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
